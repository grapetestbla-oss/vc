services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    environment:
      POSTGRES_USER: vanilla
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: vanilla
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vanilla"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ../web
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    environment:
      DATABASE_URL: postgresql://vanilla:${POSTGRES_PASSWORD}@postgres:5432/vanilla
      MC_SERVER_TOKEN: ${MC_SERVER_TOKEN:?set MC_SERVER_TOKEN}
      GAME_RTP: ${GAME_RTP:-0.95}
      VC_PER_RUB: ${VC_PER_RUB:-2}
      PARTNER_SHARE_PERCENT: ${PARTNER_SHARE_PERCENT:-10}
      # FreeKassa: без этих трёх значений пополнение остаётся ручным.
      FREEKASSA_MERCHANT_ID: ${FREEKASSA_MERCHANT_ID:-}
      FREEKASSA_SECRET1: ${FREEKASSA_SECRET1:-}
      FREEKASSA_SECRET2: ${FREEKASSA_SECRET2:-}
      FREEKASSA_PAY_URL: ${FREEKASSA_PAY_URL:-}
      FREEKASSA_CURRENCY: ${FREEKASSA_CURRENCY:-}
      FREEKASSA_IPS: ${FREEKASSA_IPS:-}
      # Платега: значения по умолчанию, ключи можно завести и в панели.
      PLATEGA_MERCHANT_ID: ${PLATEGA_MERCHANT_ID:-}
      PLATEGA_SECRET: ${PLATEGA_SECRET:-}
      PLATEGA_METHOD: ${PLATEGA_METHOD:-}
      PLATEGA_API_URL: ${PLATEGA_API_URL:-}
      PLATEGA_CURRENCY: ${PLATEGA_CURRENCY:-}
      # Управление игровым сервером из панели: без этих переменных вкладка
      # «Сервер» просто скажет, что она не настроена.
      GAME_PANEL_URL: ${GAME_PANEL_URL:-}
      GAME_PANEL_KEY: ${GAME_PANEL_KEY:-}
      GAME_PANEL_SERVER_ID: ${GAME_PANEL_SERVER_ID:-}
      BOOTSTRAP_ADMIN_LOGIN: ${BOOTSTRAP_ADMIN_LOGIN:-}
      # Telegram-бот. Без токена и секрета вебхука бот просто не работает —
      # ключи держим здесь, в репозитории их быть не должно.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-VanillaCraftx_bot}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      # Голоса в мониторинге top-minecrafter. Без ключа опрос выключен;
      # ключ и суммы можно править и в панели, здесь — значения по умолчанию.
      TOPMC_API_URL: ${TOPMC_API_URL:-https://public-api.top-minecrafter.com}
      TOPMC_SERVER_ID: ${TOPMC_SERVER_ID:-}
      TOPMC_KEY: ${TOPMC_KEY:-}
      VOTE_REWARD_VC: ${VOTE_REWARD_VC:-200}
      VOTE_STREAK_BONUS_VC: ${VOTE_STREAK_BONUS_VC:-10}
      VOTE_STREAK_CAP: ${VOTE_STREAK_CAP:-30}
      VOTE_MAX_AGE_HOURS: ${VOTE_MAX_AGE_HOURS:-48}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"

  # Служебный контейнер для схемы и каталога: у него полные node_modules со
  # сборочной стадии, поэтому Prisma CLI запускается как положено. В обычном
  # up не поднимается — только через --profile tools run.
  migrator:
    build:
      context: ../web
      target: builder
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql://vanilla:${POSTGRES_PASSWORD}@postgres:5432/vanilla
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node", "--version"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    network_mode: host
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
      MC_SERVER_IP: ${MC_SERVER_IP:-0.0.0.0/0}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config

volumes:
  pgdata:
  caddydata:
  caddyconfig:

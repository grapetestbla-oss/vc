services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vanilla
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: vanilla
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vanilla"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ../web
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://vanilla:${POSTGRES_PASSWORD}@postgres:5432/vanilla
      MC_SERVER_TOKEN: ${MC_SERVER_TOKEN:?set MC_SERVER_TOKEN}
      GAME_RTP: ${GAME_RTP:-0.95}
      BOOTSTRAP_ADMIN_LOGIN: ${BOOTSTRAP_ADMIN_LOGIN:-}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"

  # Служебный контейнер для схемы и каталога: у него полные node_modules со
  # сборочной стадии, поэтому Prisma CLI запускается как положено. В обычном
  # up не поднимается — только через --profile tools run.
  migrator:
    build:
      context: ../web
      target: builder
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql://vanilla:${POSTGRES_PASSWORD}@postgres:5432/vanilla
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node", "--version"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    network_mode: host
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
      MC_SERVER_IP: ${MC_SERVER_IP:-0.0.0.0/0}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config

volumes:
  pgdata:
  caddydata:
  caddyconfig:

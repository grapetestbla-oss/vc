name: VanillaCore
version: '${project.version}'
main: host.vanilla.core.VanillaCorePlugin
api-version: '1.21'
description: Ядро ванильного сервера — авторизация, наказания, админка, экономика
author: vc
commands:
  login:
    description: Вход по паролю с сайта
    usage: /login <пароль>
    aliases: [l]
  2fa:
    description: Подтверждение входа кодом из личного кабинета
    usage: /2fa <код>
  balance:
    description: Баланс VanillaCoins
  promo:
    description: Активировать промокод медиапартнёра
    usage: /promo <код>
  bonus:
    description: Активировать бонус-код
    usage: /bonus <код>
  cosmetics:
    description: Активная косметика и ссылка на коллекцию
    usage: /cosmetics [reload]
  report:
    description: Пожаловаться администрации
    usage: /report <текст>
  spec:
    description: Режим наблюдателя (администрация)
  esp:
    description: Подсветка игроков ниже своего уровня
  ajail:
    description: Отправить в деморган
    usage: /ajail <ник> <причина> <минуты>
  warn:
    description: Выдать варн
    usage: /warn <ник> <причина>
  ban:
    description: Забанить
    usage: /ban <ник> <причина> <дни>
  check:
    description: Вызвать на проверку на читы
    usage: /check <ник> <ссылка|pass|fail>
  asms:
    description: Личное сообщение от администрации
    usage: /asms <ник> <текст>
  news:
    description: Глобальная новость
    usage: /news <текст>
  reports:
    description: Меню репортов
  tp:
    description: Телепорт к игроку
    usage: /tp <ник>
  tphere:
    description: Телепортировать игрока к себе
    usage: /tphere <ник>
  shop:
    description: Что куплено в магазине сайта
  tpa:
    description: Запрос телепорта к игроку (покупается в магазине)
    usage: /tpa <ник>
  tpaccept:
    description: Разрешить телепорт к себе
  tpdeny:
    description: Отклонить телепорт к себе
  sethome:
    description: Отметить точку дома
  home:
    description: Телепорт к точке дома
  back:
    description: Вернуться на место смерти
  ec:
    description: Карманный эндер-сундук
  craft:
    description: Верстак с собой
  spark:
    description: Зажечь искру сезона рядом с собой (проверка)
  giveaway:
    description: Розыгрыши сервера и ваш прогресс по часам

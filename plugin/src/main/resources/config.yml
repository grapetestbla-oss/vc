# VanillaCore — ядро сервера.
# Уровни админки и права выдаются на сайте, здесь их нет.

api:
  # Адрес сайта. Плагин ходит только сюда, в базу напрямую не лезет.
  url: "https://vanillacraft.click"
  # Тот же токен, что MC_SERVER_TOKEN в .env сайта.
  token: ""
  # Адрес для ссылок в чате. По умолчанию совпадает с url.
  site-url: "https://vanillacraft.click"

auth:
  # Префикс, который Floodgate добавляет никам Bedrock-игроков. Сайту про него
  # знать не нужно: аккаунт один, с какого бы клиента человек ни зашёл.
  # Значение должно совпадать с username-prefix в конфиге Floodgate.
  bedrock-prefix: "."
  # Сколько секунд даётся на ввод пароля до кика.
  timeout-seconds: 60
  # Сколько неверных попыток подряд до кика.
  max-attempts: 3
  # Сколько секунд после выхода можно вернуться без ввода пароля.
  # Сессия привязана к IP: с другого адреса пароль спросят снова.
  # 0 — выключить продление сессии.
  rejoin-grace-seconds: 300

jail:
  world: demorgan
  auto-create: true
  size: 24
  height: 6
  floor-y: 64
  mine-material: STONE
  regen-seconds: 5
  tool: IRON_PICKAXE
  # Сколько реальных минут идёт за одну минуту срока. 10 — минута заключения
  # стоит десяти реальных минут, поэтому просто отсидеться дорого: быстрее
  # выйти работой у прораба.
  real-minutes-per-minute: 10
  # Сколько секунд срока списывает один добытый блок.
  seconds-per-block: 5
  # Наряды у прораба: он стоит в зоне и выдаёт работу.
  jobs:
    enabled: true
    foreman-name: "Прораб"
    # Перерыв между нарядами и сколько секунд срока снимает закрытый наряд.
    cooldown-seconds: 60
    reward-seconds: 60
    # Границы задания: сколько блоков наломать или мешков мусора собрать.
    blocks-min: 8
    blocks-max: 16
    litter-min: 4
    litter-max: 8
  # Как часто состояние отсидки уходит на сайт.
  sync-seconds: 30
  isolate-chat: true
  allowed-commands:
    - balance
    - report

maintenance:
  # Как часто спрашивать сайт, не включены ли техработы. Пока включены, сервер
  # никого не пускает, кроме 5 уровня.
  poll-seconds: 10

dice:
  # На каком расстоянии друг от друга игроки могут играть в кости.
  radius: 8

giveaway:
  # Как часто напоминать в чате о розыгрышах. 0 — только по команде /giveaway.
  notify-seconds: 900

news:
  # Как часто проверять, не появилось ли новостей для объявления в игре.
  poll-seconds: 60

cosmetics:
  # Как часто перечитывать надетую косметику с сайта, секунды. 0 — только при
  # входе и по команде /cosmetics обновить.
  refresh-seconds: 45

season:
  # Название сезона: видно в списке игроков и в приветствии при входе.
  name: "Season I"
  tab-enabled: true
  tab-refresh-seconds: 3

  # Искры сезона: сгусток частиц в случайном месте рядом с игроками. Кто дошёл
  # первым — забирает награду. Начисляет её сайт, плагин только сообщает о находке.
  sparks:
    enabled: true
    # Как часто пытаться зажечь новую искру.
    interval-seconds: 420
    # Сколько искр может гореть одновременно.
    max-active: 3
    # Сколько живёт искра, если её никто не забрал.
    lifetime-seconds: 240
    # На каком расстоянии от игрока появляется.
    min-distance: 25
    max-distance: 70
    # С какого расстояния засчитывается сбор.
    claim-radius: 1.6
    # Сообщать ли о находке игрокам поблизости и в каком радиусе.
    announce: true
    announce-radius: 250
    # Доля искр с VC, остальные дают осколки.
    vc-chance: 0.45
    vc-min: 3
    vc-max: 60
    shards-min: 25
    shards-max: 500

chat:
  # Обычное сообщение слышно только в этом радиусе блоков. 0 — общий чат для
  # всех, как было раньше. Администрация со 2 уровня слышит всё.
  local-radius: 200
  # С этого символа начинается сообщение всему серверу.
  global-prefix: "!"
  # Пересылать общий чат в Telegram. Куда именно — задаётся на сайте.
  # Местные сообщения не пересылаются.
  relay-to-telegram: true
  # Как часто отправлять накопленное. Пачкой, потому что Telegram ограничивает
  # частоту сообщений в группу.
  relay-seconds: 5

sidebar:
  # Боковая панель: ник, уровень, баланс и прогресс дневной нормы.
  enabled: true
  refresh-seconds: 5
  # Сколько минут бездействия считается афк. Такие минуты в дневную норму не
  # идут — иначе её закрывал бы любой, кто оставил клиент на ночь.
  afk-minutes: 5

votes:
  # Как часто просить сайт забрать свежие голоса из мониторинга. Обратного
  # вызова у мониторинга нет, поэтому опрашиваем сами. 0 — выключить.
  poll-seconds: 300

shop:
  # Как часто перечитывать покупки игроков в сети. Покупка и так будит плагин
  # поручением, но страховке инвентаря ждать сеть в момент смерти нельзя —
  # поэтому кэш держим свежим.
  refresh-seconds: 120

panel:
  # Как часто слать сайту слепок инвентаря игроков — его показывает панель.
  # Кнопка «обновить» в панели запрашивает слепок вне очереди.
  inventory-report-seconds: 60

staff:
  # Администрация со 2 уровня всегда в режиме наблюдателя.
  always-spectator: true
  # true — администрация не может ломать и ставить блоки даже после /spec.
  # По умолчанию false: вышел из наблюдателя — играешь как все.
  protect-world: false
  esp-refresh-seconds: 5

